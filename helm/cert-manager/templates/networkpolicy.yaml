apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manchester-network-policy
  namespace: {{ include "cert-manager.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: manchester
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: manchester
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: manchester
