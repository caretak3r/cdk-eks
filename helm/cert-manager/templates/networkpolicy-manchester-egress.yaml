apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manchester-allow-egress
  namespace: {{ include "cert-manager.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: manchester
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: manchester
