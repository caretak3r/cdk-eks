appName: tokenapp
namespace: application



initContainers:
  - name: tokenapp-init
    image: ""
    imagePullPolicy: IfNotPresent
    env:
      - name: INIT_APP_KMS_ARN
        value: ""
    volumeMounts: []
  - name: tokenapp-db-init
    image: ""
    imagePullPolicy: IfNotPresent
    env: []
    volumeMounts: []


tokenApp:
    replicaCount: 1
    image:
        repository: ""
        tag: ""
        pullPolicy: ""
    extraArgs: []
    env: []
    annotations: {}
    ingress:
        enabled: true
        className: ""
        annotations: {}
        # kubernetes.io/ingress.class: nginx
        # kubernetes.io/tls-acme: "true"
        hosts:
          - host: tokenapp.example.com
            paths:
              - path: /
                pathType: ImplementationSpecific
        tls: []
        #  - secretName: chart-example-tls
        #    hosts:
        #      - chart-example.local
        

secretsServiceBroker:
    enable: true
    replicaCount: 1
    image:
        repository: ""
        tag: ""
        pullPolicy: ""
    extraArgs: []
    env: []
    annotations: {}
    externalSecretsManagementSystem: [] # [vault, aws-secrets-manager, gcp-secret-manager, azure-key-vault]


