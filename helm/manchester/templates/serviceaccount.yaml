---
{{- if .Values.manchester.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.manchester.serviceAccount.name }}
  labels:
    {{- with .Values.manchester.metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.manchester.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.manchester.serviceAccount.annotations | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.manchester.serviceAccount.automount }}
{{- end }}