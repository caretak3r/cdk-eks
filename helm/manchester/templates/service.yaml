---
apiVersion: v1
kind: Service
metadata:
  name: manchester-main
  namespace: {{ .Values.namespace }}
  labels:
    {{- with .Values.manchester.metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http-main
      port: 8080
      protocol: TCP
      targetPort: http-main
  selector:
    {{- include "manchester.selectorLabels" . | nindent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: manchester-secrets-service-sidecar
  namespace: {{ .Values.namespace }}
  labels:
    {{- with .Values.manchester.metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 6666
      protocol: TCP
      targetPort: http
  selector:
    {{- include "manchester.selectorLabels" . | nindent 4 }}

