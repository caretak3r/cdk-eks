---
apiVersion: v1
kind: Service
metadata:
  name: manchester-main
  namespace: {{ .Values.namespace }}
  labels:
    {{- with .Values.manchester.metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: mtls-main
      port: 8443
      protocol: TCP
      targetPort: http-main-tls
  selector:
    {{- include "manchester.selectorLabels" . | nindent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: manchester-secrets-service-sidecar
  namespace: {{ .Values.namespace }}
  labels:
    {{- with .Values.manchester.metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: mtls-sidecar
      port: 9443
      protocol: TCP
      targetPort: http-sidecar-tls
  selector:
    {{- include "manchester.selectorLabels" . | nindent 4 }}

