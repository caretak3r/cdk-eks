apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: {{ include "manchester-tokenization.fullname" . }}-gateway
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "*"
    tls:
      mode: SIMPLE
      credentialName: "arn:aws:acm:us-west-2:111111111111:certificate/aaaaaaaa-bbbb-cccc-dddd-ffffffffffff"

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: manchester-authz
  namespace: manchester
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
  - from:
    - source:
        requestPrincipals: ["*"]
    when:
    - key: request.auth.claims[scope]
      values: ["placeholder-scope"]