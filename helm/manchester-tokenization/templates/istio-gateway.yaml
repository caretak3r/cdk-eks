apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: manchester-gateway
  namespace: manchester
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "*"
    tls:
      mode: SIMPLE
      credentialName: "arn:aws:acm:us-west-2:728168703404:certificate/8058f29c-02ce-416d-ac25-fb2f2e72aab0"

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: manchester-authz
  namespace: manchester
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
  - from:
    - source:
        requestPrincipals: ["*"]
    when:
    - key: request.auth.claims[scope]
      values: ["placeholder-scope"]
