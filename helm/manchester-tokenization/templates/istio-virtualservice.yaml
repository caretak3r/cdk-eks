apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "manchester-tokenization.fullname" . }}-virtualservice
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  hosts:
  - "{{ .Values.ingress.hosts[0].host | default "*" }}"
  gateways:
  - {{ include "manchester-tokenization.fullname" . }}-gateway
  http:
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: manchester-secret-service
        port:
          number: 5000
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: manchester-service
        port:
          number: 80
