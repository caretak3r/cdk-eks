apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: manchester-virtualservice
  namespace: manchester
spec:
  hosts:
  - "manchester.tkp.internal"
  gateways:
  - manchester-gateway
  http:
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: manchester-service
        port:
          number: 80
