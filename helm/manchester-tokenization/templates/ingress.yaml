---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: manchester-ingress
  namespace: manchester
  annotations:
    kubernetes.io/ingress.class: istio
    ingressgateway.istio.io/default-gateway: manchester-gateway
    istio.io/managed-by: Helm
spec:
  ingressClassName: istio-ingressgateway
  rules:
    - host: manchester.tkp.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "manchester-tokenization.fullname" . }}-gateway
                port:
                  number: 80