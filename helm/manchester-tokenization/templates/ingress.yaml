---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: manchester-ingress
  namespace: manchester
  annotations:
    kubernetes.io/ingress.class: alb
    kubernetes.io/ingress.class: istio
    ingressgateway.istio.io/default-gateway: manchester-gateway
spec:
  ingressClassName: alb
  rules:
    - host: manchester.tkp.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: manchester-service
                port:
                  number: 80