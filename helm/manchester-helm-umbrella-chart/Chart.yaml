apiVersion: v2
name: manchester-helm-umbrella-chart
description: A Helm chart for Kubernetes

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "1.16.0"

dependencies:
  - name: manchester
    alias: manchester
    version: v0.1.0
    repository: 111111111111.dkr.ecr.us-west-2.amazonaws.com/manchester-helm-chart
    condition: manchester.enabled
    tags:
      - application
      - web
      - api

  - name: fluent-bit
    alias: fluent-bit
    version: v0.1.0
    repository: 111111111111.dkr.ecr.us-west-2.amazonaws.com/fluent-bit-helm-chart
    condition: fluent-bit.enabled
    tags:
      - logging

  - name: otel-collector
    alias: otel-collector
    version: v0.1.0
    repository: 111111111111.dkr.ecr.us-west-2.amazonaws.com/aws-otel-collector
    condition: otel-collector.enabled
    tags:
      - monitoring
      - telemetry

  - name: aws-load-balancer-controller
    version: v1.6.2
    repository: 111111111111.dkr.ecr.us-west-2.amazonaws.com/aws-load-balancer-controller-helm-chart
    condition: aws-load-balancer-controller.enabled
    tags:
      - ingress

  - name: cert-manager
    version: v1.13.2
    repository: 111111111111.dkr.ecr.us-west-2.amazonaws.com/cert-manager-helm-chart
    condition: cert-manager.enabled
    tags:
      - security
      - certs

  - name: karpenter
    version: v0.1.0
    repository: 111111111111.dkr.ecr.us-west-2.amazonaws.com/karpenter-helm-chart
    condition: karpenter.disabled
    tags:
      - autoscaling

  - name: vault
    version: v0.1.0
    repository: 111111111111.dkr.ecr.us-west-2.amazonaws.com/vault-helm-chart
    condition: vault.disabled
    tags:
      - security
      - secrets